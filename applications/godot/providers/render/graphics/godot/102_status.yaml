id: SCR-PROVIDER-RENDER-GODOT
name: Godot Render Provider
domain: render
technology: godot
version: 0.7.0
status: operational
spec: 101_definition.md
contract: 104_contract.md
schema_version: 7
abi_version: 2
ipc_proto_version: 1

purpose: >
  Realize SCR renderable semantic state as a Godot 4.7.2 presentation via a
  RenderSnapshot byte contract and a GDExtension adapter whose transport sits
  behind ITransport: in-process dlopen (default) or Unix-domain-socket client
  to a spawned out-of-process sim server (SCR_SIM_TRANSPORT=socket).
  Provider only; never semantic authority.

