id: SCR-PROVIDER-RENDER-GODOT
name: Godot Render Provider
domain: render
technology: godot
version: 0.3.0
status: operational
spec: 101_definition.md
contract: 104_contract.md
schema_version: 3
abi_version: 1

purpose: >
  Realize SCR renderable semantic state as a Godot 4.7.2 presentation via a
  RenderSnapshot byte contract and an in-process GDExtension adapter.
  Provider only; never semantic authority.

capabilities:
  - id: CAP-GODOT-SNAPSHOT-DECODE
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0002
  - id: CAP-GODOT-TERRAIN-MANIFESTATION
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0002
  - id: CAP-GODOT-OCEAN-MANIFESTATION
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0002
  - id: CAP-GODOT-SKY-MANIFESTATION
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0002
  - id: CAP-GODOT-INPUT-UPLINK
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0002
  - id: CAP-GODOT-VOLCANO-LAKE
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0003
  - id: CAP-GODOT-PLUME
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0003
  - id: CAP-GODOT-CRATER-GLOW
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0003
  - id: CAP-GODOT-ATMOSPHERE-DERIVATION
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0004
  - id: CAP-GODOT-CLOUD-DECK
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0004
  - id: CAP-GODOT-PRECIPITATION
    status: implemented
    milestone: applications/godot/v0.0.1-milestone_0004

depends_on:
  - SCR-LIB-RENDER
  - SCR-LIB-MATH-GERSTNER

implementation:
  language: C++17 (godot-cpp GDExtension)
  header: adapter/scr_godot_abi.h
  library_loaded: applications/godot/src/mojo/libscr_sim.so
  build: applications/godot/scripts/build_godot_provider.sh

limitations:
  - Snapshot transport is in-process dlopen only (IPC transport = future milestone)
  - No vegetation, fauna manifestation (successor milestones)
  - Plume turbulence noise exposed with velocity influence locked to 0 (Godot velocity-influence collapses buoyant columns; docs/04 §8.3) — display turbulence = future milestone
  - Sun disc is not in the default spawn frame (arc elevation 68.75° vs FOV half-angle 35°); verified via a sun-aimed sub-capture — recorded deviation, docs/04 §8.4
  - Cloud/rain pattern, scale and drift are display-only (cloud_cover/precipitation are the wire contract)
  - Engine exponential fog disabled in the cloud shader with shader-local fades (deck was fully fogged out) — docs/04 §8.4
