  - id: CAP-GODOT-FLORA-CHANGE-EMISSION
    status: implemented
    milestone: applications/godot/v0.0.2-milestone_0009
    note: >
      Applies the §10 FLORA section whenever present (sim-side change-driven
      rule, 104_contract §4.3 §10); absent section retains the cached
      instances (invariant 5). Layout untouched by 0009: schema stayed 6,
      ABI 2, 4 + 24·count records (grown to schema 7 by 0010 — see
      CAP-GODOT-FLORA-SEED-STAGE).
  - id: CAP-GODOT-FLORA-SEED-STAGE
    status: implemented
    milestone: applications/godot/v0.0.2-milestone_0010
    note: >
      §10 FLORA record 24 → 32 B (schema 7, spec §3.2): +u32 variant_seed
      (offset 24), +u8 stage ∈ 0..15 (offset 28), +u8×3 pad = 0 (offset 29);
      payload 4 + 32·count (max 131,076 B at FLORA_N_MAX). Adapter validates stage ≤ 15, pad == 0 and
      exact framing loudly (104_contract §8); sections 1–9 and 11–14
      byte-identical, ABI stays 2. No geometry or symbol strings on the
      wire (invariant 6 / AP-25): renderers derive canopy shapes locally
      from variant_seed + stage (Morphology §17 Repetition, line 577 —
      compact generative description). Emission also fires on stage /
      variant_seed deltas vs the last send (0010 R7).

depends_on:
  - SCR-LIB-RENDER
  - SCR-LIB-MATH-GERSTNER

implementation:
  language: C++17 (godot-cpp GDExtension)
  header: adapter/scr_godot_abi.h
  library_loaded: applications/godot/src/mojo/libscr_sim.so
  build: applications/godot/scripts/build_godot_provider.sh
  transports: adapter/transport_inproc.cpp (default) + adapter/transport_socket.cpp (opt-in)
  server_binary: applications/godot/build/scr_sim_server (via applications/godot/scripts/build_sim_server.sh)

limitations:
  - Socket transport is opt-in (SCR_SIM_TRANSPORT=socket); default stays in-process. Adapter external-owner mode (connect, never respawn) lacks a dedicated gate — docs/04 §9 gap 18
  - Flora sway and bird flap run on shader TIME (display-only; no phase bytes in the wire, 0006 AP-12)
  - Plume turbulence noise exposed with velocity influence locked to 0 (Godot velocity-influence collapses buoyant columns; docs/04 §8.3) — display turbulence = future milestone
  - Sun disc is not in the default spawn frame (arc elevation 68.75° vs FOV half-angle 35°); verified via a sun-aimed sub-capture — recorded deviation, docs/04 §8.4
  - Cloud/rain pattern, scale and drift are display-only (cloud_cover/precipitation are the wire contract)
  - Engine exponential fog disabled in the cloud shader with shader-local fades (deck was fully fogged out) — docs/04 §8.4
  - Hotbar/target/props HUD are read-only projections; edit intent is the only uplink (op + select_slot — client never names cells/materials, 0007 AP-12)
  - Props model is minimal (gravity + ground contact, no inter-body collision, N ≤ 16) — advanced physics = future milestone (0007 §3.5)
