schema_version: 0.1.0
project: SDP-PROJ-HYRXMQ
adopted_by: SDP-ADOPT-HYRXMQ-0001
classification_labels:
- established_definition
- formal_result
- derived_consequence
- counterexample
- analogy
- conjecture
