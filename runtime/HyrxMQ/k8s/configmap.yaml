apiVersion: v1
kind: ConfigMap
metadata:
  name: hyrxmq-config
  namespace: hyrxmq
  labels:
    app.kubernetes.io/name: hyrxmq
data:
  HYRXMQ_HOST: "0.0.0.0"
  HYRXMQ_PORT: "5672"
  HYRXMQ_WEB_PORT: "8080"
  HYRXMQ_NODE_NAME: "hyrxmq@localhost"
  HYRXMQ_STORAGE_MODE: "disabled"
  HYRXMQ_HEARTBEAT_SECS: "60"
  HYRXMQ_FRAME_MAX: "131072"
  HYRXMQ_MAX_CONNECTIONS: "1024"
  HYRXMQ_MAX_MESSAGE_SIZE: "134217728"
  HYRXMQ_MAX_QUEUES: "65535"
  HYRXMQ_MAX_EXCHANGES: "65535"
  HYRXMQ_IDLE_TIMEOUT_SECS: "300"
  HYRXMQ_MAX_MEMORY_BYTES: "536870912"
