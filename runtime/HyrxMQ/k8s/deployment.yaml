apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyrxmq
  namespace: hyrxmq
  labels:
    app.kubernetes.io/name: hyrxmq
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hyrxmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyrxmq
        app.kubernetes.io/component: broker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hyrxmq
          image: hyrxmq:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: web
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hyrxmq-config
            - secretRef:
                name: hyrxmq-credentials
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: web
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5 && kill -TERM 1"]
