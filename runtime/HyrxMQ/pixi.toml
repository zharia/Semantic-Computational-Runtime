[workspace]
name = "hyrx"
version = "0.1.0-dev"
description = "Native Mojo messaging engine and HyrxMQ broker groundwork"
channels = ["conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
license = "Apache-2.0"
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.0.0,<2"
openssl = ">=3"

# Phase 0 intentionally keeps dependencies minimal.
# Add dependencies only after documenting purpose, license, maintenance,
# security, performance, and build/deployment implications.

# Vendored flare (vendor/flare, ADR-0005) compiles/runs TCP+UDS with no extra
# conda deps on Linux (verified). OpenSSL wired for TCP-tier TLS (Phase 11).

[tasks]
build = "mkdir -p build && mojo build -I src -I vendor/flare src/hyrx/main.mojo -o build/hyrx"
hyrxmq = "mkdir -p build && mojo build -I src -I vendor/flare src/hyrxmq/main.mojo -o build/hyrxmq"
hyrxmq-listen = "mkdir -p build && clang -O2 -c src/hyrxmq/shutdown_shim.c -o build/shutdown_shim.o && mojo build -I src -I vendor/flare -Xlinker build/shutdown_shim.o src/hyrxmq/main_listen.mojo -o build/hyrxmq-listen"
hyrxmq-web = "mkdir -p build && cd src/hyrxmq_web/frontend && npm run build && cd ../../.. && clang -O2 -c src/hyrxmq/shutdown_shim.c -o build/shutdown_shim.o && mojo build -I src -I vendor/flare -Xlinker build/shutdown_shim.o src/hyrxmq_web/hyrxmq_web.mojo -o build/hyrxmq-web"
hyrxmq-web-run = "mkdir -p build && mojo run -I src -I vendor/flare src/hyrxmq_web/hyrxmq_web.mojo"
test = "bash scripts/test_all.sh"

# Benchmark suite (audit §19/§20/§21). Not part of scripts/test_all.sh — these
# are long-running empirical workloads, kept out of the correctness suite.
bench-direct = "mojo run -I src -I vendor/flare benchmarks/interleaved_direct.mojo"
bench-transport = "mojo run -I src -I vendor/flare benchmarks/transport_matrix.mojo"
bench-fanout = "mojo run -I src -I vendor/flare benchmarks/fanout_copy.mojo"
bench-profile = "mojo run -I src -I vendor/flare benchmarks/profiling_probe.mojo"

# Fair RabbitMQ-vs-HyrxMQ AMQP benchmark over a real pika client
# (benchmarks/perf, audit §19/§20/§32/§48). Transport-symmetric: the headline
# rating compares rabbit-tcp against hyrx-tcp-docker through the SAME docker
# port-published path. Not part of scripts/test_all.sh.
bench-fair = "bash benchmarks/perf/run_all.sh"
bench-regress = "python benchmarks/perf/compare.py --baseline benchmarks/perf/baseline.json"

# Docker build + run.
docker-build = "docker build -t hyrxmq ."
docker-run = "docker run -p 8081:8080 -p 5674:5673 hyrxmq"
docker-stop = "docker stop hyrxmq 2>/dev/null; docker rm hyrxmq 2>/dev/null"

# Stress / soak benchmark suite
bench-stress = "bash benchmarks/stress/run.sh"
bench-stress-quick = "bash benchmarks/stress/run.sh --quick"
bench-stress-soak = "bash benchmarks/stress/run.sh --soak 3600"

