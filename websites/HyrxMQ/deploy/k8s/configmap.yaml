apiVersion: v1
kind: ConfigMap
metadata:
  name: hyrxmq-website-nginx
  namespace: hyrxmq-website
  labels:
    app.kubernetes.io/name: hyrxmq-website
    app.kubernetes.io/part-of: hyrx
data:
  # Ingress controllers commonly cap response body/proxy buffers; the site is
  # static, so these are conservative defaults rather than tuning knobs.
  server-tokens: "off"
