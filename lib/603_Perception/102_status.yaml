domain:
  name: Perception
  description: >
    Normative semantic computational domain for transforming available observations
    and information into representations that are meaningful to a declared perceiving system,
    process, agent, or computational context.
  purpose: >
    Define observer-relative perceptual processes P = (O, C, K, T, R, U, X), feature extraction,
    detection, classification, identification, tracking, segmentation, perceptual uncertainty,
    ambiguity representation, and projection into the canonical SCR semantic hypergraph.

