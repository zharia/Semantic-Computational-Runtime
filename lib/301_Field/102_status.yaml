domain:
  name: Fields
  description: >
    Normative semantic computational domain defining fields as structures assigning,
    relating, or evolving meaningful information over a defined domain.
  purpose: >
    Provide continuous and discrete field abstractions, value spaces (scalar, vector, tensor),
    differential operators (gradient, divergence, curl, Laplacian), advection, diffusion,
    interpolation, boundary conditions, level sets / signed distance fields, and canonical
    hypergraph projection.

