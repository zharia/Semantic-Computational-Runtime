domain:
  name: Morphology
  description: >
    Normative semantic computational domain concerned with form, structure, organisation,
    differentiation, arrangement, and transformation of meaningful entities and patterns.
  purpose: >
    Provide representation-independent morphological semantics (hierarchical structural organisation,
    part-whole relationships, bidirectional pattern-morphology mappings, morphological features,
    branching, symmetry, skeletonisation, growth, erosion, and fracture transformations) with
    canonical hypergraph projection.

capabilities:
  - id: CAP-MORPH-STRUCTURE
    name: Hierarchical Structural Organisation & Part-Whole Relations
    status: operational
  - id: CAP-MORPH-PATTERN
    name: Bidirectional Pattern-Morphology Mappings & Generation
    status: operational
  - id: CAP-MORPH-FEATURES
    name: Morphological Features, Symmetry & Medial Axis Skeletons
    status: operational
  - id: CAP-MORPH-TRANSFORMATION
    name: Morphological Transformations (Growth, Erosion, Fracture, Deformation)
    status: operational
  - id: CAP-MORPH-INVARIANTS
    name: Morphological Invariant Conformance & Preservation Contracts
    status: operational
  - id: CAP-MORPH-HYPERGRAPH
