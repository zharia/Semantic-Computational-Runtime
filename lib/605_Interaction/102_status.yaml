domain:
  name: Interaction
  description: >
    Normative semantic computational domain defining the structures through which
    an actor, observer, agent, process, device, or computational entity participates in a
    computational field.
  purpose: >
    Define actor participation, modality-independent input, gesture recognition,
    algebraic composition (sequence, chord, multimodal), interaction context and modes,
    intent representation, action mapping, session lifecycle (capture, commitment, cancellation),
    closed-loop feedback, and projection into the canonical SCR hypergraph.

