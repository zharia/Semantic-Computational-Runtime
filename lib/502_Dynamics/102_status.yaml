domain:
  name: Dynamics
  description: >
    Normative semantic computational domain concerned with change, evolution, transition,
    interaction, feedback, stability, adaptation, and temporal development of systems and their states.
  purpose: >
    Provide representation-independent dynamical semantics (state spaces, continuous and discrete
    vector fields, state transitions, state deltas, trajectory histories, stability analysis,
    and equilibrium points) with canonical hypergraph projection.

