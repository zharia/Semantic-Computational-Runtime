domain:
  name: Phenotype
  description: >
    Normative SCR Evolution subdomain defining the genotype (trait vector) to phenotype
    (form parameters) mapping as a pure deterministic function, its distinction from
    selection and from growth, and its determinism and reproducibility conformance.
  purpose: >
    Provide the definition that trait-to-form modulation implementations consume, while
    selection remains authoritative in SCR-LIB-EVOLUTION, growth in
    SCR-LIB-MORPHOLOGY-GROWTH, grammar and derivation semantics in
    SCR-LIB-MORPHOLOGY-PROCEDURAL, and ecology membership in SCR-LIB-ECOLOGY-FLORA.

