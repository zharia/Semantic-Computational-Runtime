domain:
  name: Evolution
  description: >
    Normative semantic computational domain concerned with persistent change in populations,
    systems, structures, or distributions across evolutionary timescales through variation,
    inheritance, selection, transformation, and differential persistence — distinct from
    adaptation, learning, and optimisation.
  purpose: >
    Provide representation-independent semantics for variation, selection, viability,
    environmental conditions, lineage, and reproducibility that ecological domains (such as
    Flora) consume conformantly, while evolution meaning remains authoritative here.

