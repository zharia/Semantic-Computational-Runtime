domain:
  name: Mathematics
  description: >
    Foundational normative semantic domain defining mathematical structures, relations,
    operations, spaces, quantities, and algebraic laws as first-class computational objects.
  purpose: >
    Establish formal mathematical meaning decoupled from floating-point hardware and libraries;
    formalize exact vs approximate tolerance contracts, algebraic structures (Monoid, Group, Ring, Field),
    linear algebra (vectors, matrices, quaternions), forward-mode automatic differentiation (dual numbers),
    calculus contracts, and canonical hypergraph projection.

