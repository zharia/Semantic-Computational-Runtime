domain:
  name: Physics
  description: >
    Normative semantic computational domain concerned with the meaning, relationships,
    laws, constraints, interactions, quantities, states, and transformations that describe
    physical systems and phenomena.
  purpose: >
    Provide representation-independent physical semantics (dimensional analysis, physical units,
    conservation laws of energy, momentum, and charge, physical bodies, multi-body higher-order
    interactions, constraints, and equations of motion) with canonical hypergraph projection.

