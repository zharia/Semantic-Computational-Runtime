  - id: CAP-PHYS-LAWS
    name: Physical Laws, Symmetries & Equations of Motion
    status: operational
  - id: CAP-PHYS-CONSERVATION
    name: Conservation Tracking (Energy, Linear & Angular Momentum, Charge)
