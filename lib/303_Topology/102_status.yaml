domain:
  name: Topology
  description: >
    Normative semantic computational domain concerned with connectivity, continuity,
    adjacency, neighbourhood, incidence, boundaries, structural relationships, and
    properties preserved under continuous transformations, independently of metric geometry.
  purpose: >
    Provide representation-independent topological semantics (spaces, open sets, simplicial
    and cell complexes, boundary operators ∂∘∂=0, Euler characteristic, genus, homology invariants,
    and topology-preserving vs changing transformations) with canonical hypergraph projection.

