domain:
  name: Interfaces
  description: >
    Cross-cutting normative semantic domain defining interaction boundaries,
    capabilities, preconditions, postconditions, invariants, behavioural contracts,
    effects, and provider substitutability across computational domains.
  purpose: >
    Provide stable semantic boundaries (what may be relied upon) decoupled from concrete
    implementations (how it is realized); formalize the conceptual model
    I = (N, O, T, C, B, S, E, R, K, V, P), 25 capability interfaces, refinement,
    composition, and canonical hypergraph projection.

