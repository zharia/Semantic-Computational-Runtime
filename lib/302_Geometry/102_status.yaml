domain:
  name: Geometry
  description: >
    Normative semantic computational domain concerned with spatial form, position,
    extent, measurement, geometric relationships, and transformations of spatial structures.
  purpose: >
    Provide representation-independent geometric semantics (points, vectors, primitives,
    curves, surfaces, meshes, solids, CSG, ray intersections, and affine transformations)
    with canonical hypergraph projection and technological independence.

capabilities:
  - id: CAP-GEOM-AFFINE
