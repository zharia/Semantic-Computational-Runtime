domain:
  name: Flora
  description: >
    Normative SCR Ecology subdomain defining living flora semantics: flora population membership
    as an explicit instance list, the flora establishment field over the terrain-cell domain,
    growth conformance to Morphology Growth, selection-and-variation conformance to Evolution,
    and deterministic decision semantics.
  purpose: >
    Provide the definition that flora establishment, growth, trait variation, selection, death,
    and regrowth implementations consume, while evolution meaning remains authoritative in
    SCR-LIB-EVOLUTION and population/environment meaning remains authoritative in SCR-LIB-ECOLOGY.

