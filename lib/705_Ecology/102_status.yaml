domain:
  name: Ecology
  description: >
    Normative semantic computational domain concerned with the relationships, interactions,
    dependencies, flows, feedbacks, and co-evolutionary dynamics among populations, entities,
    systems, and their environments — including population, environment, community, ecological
    fields, and ecological state semantics.
  purpose: >
    Provide representation-independent semantics for interacting populations, systems, resources,
    and environments, including the flows, relationships, feedbacks, constraints, and collective
    dynamics through which an ecosystem exists and changes, while keeping evolution distinct
    (ECOLOGY-INV-013).

