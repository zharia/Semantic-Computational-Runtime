domain:
  name: Spatial
  description: >
    Normative semantic computational domain defining where entities and information exist,
    how they relate spatially, how spatial context is established, and how spatial structure
    participates in computation.
  purpose: >
    Define spatial domains, reference frames, coordinate systems, position distinction,
    metrics, distances, regions, spatial relationships, spatial transformations, spatial queries,
    dynamic trajectories, uncertainty, and projection into the canonical SCR hypergraph.

