domain:
  name: Stream
  description: >
    Normative semantic computational domain defining ordered, causal, continuous,
    or discrete evolution and availability of information, state, occurrences,
    observations, operations, and transformations.
  purpose: >
    Define streams orthogonally to physical transports, brokers, buffers, and pipelines;
    formalize element occurrence vs availability vs observation, multi-clock temporal semantics,
    vector clock causal ordering, state vs delta reconstruction, windowing, and hypergraph projection.

