  classification: predicate
  domain: Transformation × SemanticState × Context
  codomain: Prop
  laws: [IncidenceWellFormed]
  lean_definition: "def isAdmissible (t : Transformation) (s : SemanticState) (_ : Context) : Prop := isApplicable t s = true ∧ IncidenceWellFormed s"
  lean_evidence: [IncidenceWellFormed from SCR.Hypergraph]
  counterexamples: [CX_02_dangling_edge_rejected, CX_03_incident_node_removal_rejected]
  documentation: [primitive_inventory.md, canonical_algebra.md, algebraic_laws.md]
